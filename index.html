<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Futbolcu Düellosu | İki Kişilik Bilgi Yarışması</title>
  <meta name="description" content="İki kişilik sıra tabanlı (hot-seat) futbolcu istatistik ve bilgi karşılaştırma yarışması." />
  <meta property="og:title" content="Futbolcu Düellosu | İki Kişilik Bilgi Yarışması" />
  <meta property="og:description" content="İki kişilik sıra tabanlı futbolcu istatistik ve bilgi karşılaştırma yarışması." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       TEMEL DEĞİŞKENLER VE SIFIRLAMA (Modern Koyu Futbol Teması)
       ========================================================================== */
    :root {
      --bg-primary: #070a12;
      --bg-surface: #0e1424;
      --bg-surface-elevated: #151f38;
      --bg-surface-glass: rgba(18, 27, 48, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: #10b981;
      
      --accent-pitch: #10b981;
      --accent-pitch-glow: rgba(16, 185, 129, 0.25);
      --accent-gold: #f59e0b;
      --accent-gold-glow: rgba(245, 158, 11, 0.25);
      --accent-cyan: #06b6d4;
      --accent-crimson: #ef4444;

      --p1-color: #38bdf8;
      --p1-bg: rgba(56, 189, 248, 0.12);
      --p1-border: rgba(56, 189, 248, 0.35);

      --p2-color: #f97316;
      --p2-bg: rgba(249, 115, 22, 0.12);
      --p2-border: rgba(249, 115, 22, 0.35);

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --font-display: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.12), transparent 70%),
        radial-gradient(ellipse 60% 40% at 50% 120%, rgba(56, 189, 248, 0.08), transparent 70%),
        linear-gradient(180deg, #070a12 0%, #0a0f1d 100%);
      background-attachment: fixed;
    }

    /* Tabular rakamlar */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Ana Konteyner */
    .app-container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 1rem 1.25rem 3rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Üst Bar */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      background: var(--bg-surface-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-ball {
      display: inline-block;
      font-size: 1.2rem;
      animation: spin-slow 20s linear infinite;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      width: 38px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 1rem;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Canlı Skor & Tur Paneli */
    .hud-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    .hud-player {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .hud-player-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .hud-player-p1 .hud-player-dot {
      background-color: var(--p1-color);
      box-shadow: 0 0 10px var(--p1-color);
    }

    .hud-player-p2 .hud-player-dot {
      background-color: var(--p2-color);
      box-shadow: 0 0 10px var(--p2-color);
    }

    .hud-player-name {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .hud-player-score {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      padding: 0.15rem 0.6rem;
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
    }

    .hud-round-pill {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    /* Kartlar ve Görsel Kapsayıcılar */
    .card-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    /* Hedef Oyuncu Vitrini */
    .target-showcase {
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.12), transparent 70%), var(--bg-surface-elevated);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .target-kicker {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-pitch);
      margin-bottom: 0.75rem;
      display: inline-block;
    }

    .target-name {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .target-question-box {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 0.6rem 1.5rem;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      max-width: 90%;
    }

    .target-question-icon {
      font-size: 1.25rem;
    }

    /* 6 Soru Türü Etiketleri */
    .question-badges-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .q-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.75rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .q-badge.active {
      color: #fff;
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--accent-pitch);
      box-shadow: 0 0 15px var(--accent-pitch-glow);
    }

    /* Sıra Bildirimi */
    .turn-status-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      border-radius: var(--radius-md);
      margin-bottom: 1.5rem;
      font-weight: 700;
      font-size: 1rem;
    }

    .turn-p1 {
      background: var(--p1-bg);
      border: 1px solid var(--p1-border);
      color: var(--p1-color);
    }

    .turn-p2 {
      background: var(--p2-bg);
      border: 1px solid var(--p2-border);
      color: var(--p2-color);
    }

    /* Tahmin Formu ve Otomatik Tamamlama */
    .guess-form {
      position: relative;
    }

    .input-group {
      position: relative;
      margin-bottom: 1rem;
    }

    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      color: #fff;
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 0.95rem 1.25rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-pitch);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 3px var(--accent-pitch-glow);
    }

    .search-input::placeholder {
      color: var(--text-dim);
      font-weight: 400;
    }

    /* Otomatik Tamamlama Açılır Kutusu */
    .autocomplete-list {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      max-height: 260px;
      overflow-y: auto;
      z-index: 50;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      list-style: none;
    }

    .autocomplete-list::-webkit-scrollbar {
      width: 6px;
    }
    .autocomplete-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .autocomplete-item {
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.12s ease;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover,
    .autocomplete-item.selected {
      background: rgba(16, 185, 129, 0.15);
    }

    .autocomplete-item-name {
      font-weight: 700;
      color: #fff;
      font-size: 0.95rem;
    }

    .autocomplete-item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Butonlar */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      padding: 0.9rem 1.75rem;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      width: 100%;
      min-height: 48px;
      text-decoration: none;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 4px 15px var(--accent-pitch-glow);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    .btn-p1 {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #070a12;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
    }

    .btn-p2 {
      background: linear-gradient(135deg, #fb923c 0%, #ea580c 100%);
      color: #070a12;
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.25);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border-subtle);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    /* Hata ve Uyarı Kutusu */
    .alert-box {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Gizlilik / Ara Ekran (Hot-seat Handoff) */
    .handoff-panel {
      text-align: center;
      padding: 3.5rem 1.5rem;
    }

    .handoff-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulse-scale 2s infinite ease-in-out;
    }

    @keyframes pulse-scale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .handoff-title {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.75rem;
    }

    .handoff-desc {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 480px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }

    /* Sonuç Ekranı Karşılaştırma Kartları */
    .results-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin: 2rem 0;
    }

    @media (max-width: 680px) {
      .results-comparison {
        grid-template-columns: 1fr;
      }
    }

    .player-result-card {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .player-result-card.winner {
      border-color: var(--accent-pitch);
      background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15), var(--bg-surface-elevated) 70%);
      box-shadow: 0 0 25px var(--accent-pitch-glow);
    }

    .result-badge-winner {
      position: absolute;
      top: -12px;
      right: 14px;
      background: var(--accent-pitch);
      color: #070a12;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .player-result-header {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .player-result-card.p1-card .player-result-header { color: var(--p1-color); }
    .player-result-card.p2-card .player-result-header { color: var(--p2-color); }

    .result-guess-name {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .result-guess-val {
      font-size: 1rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .result-diff-box {
      margin-top: auto;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      padding: 0.85rem;
      text-align: center;
    }

    .result-diff-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .result-diff-value {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
    }

    .round-outcome-banner {
      text-align: center;
      padding: 1.25rem;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    /* Final Ekranı */
    .gameover-podium {
      text-align: center;
      padding: 2rem 1rem;
    }

    .gameover-trophy {
      font-size: 4rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: float-trophy 3s ease-in-out infinite;
    }

    @keyframes float-trophy {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .gameover-winner-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: var(--accent-gold);
    }

    .gameover-score-pill {
      display: inline-flex;
      align-items: center;
      gap: 1.5rem;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1rem 2rem;
      margin: 1.5rem 0 2rem;
    }

    .gameover-score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gameover-score-num {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 900;
    }

    /* Tur Geçmişi Listesi */
    .history-section {
      margin-top: 2rem;
      text-align: left;
    }

    .history-title {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 0.35rem;
    }

    .history-item {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .history-item {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    /* Başlangıç Ayar Formu */
    .setup-group {
      margin-bottom: 1.5rem;
    }

    .setup-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .setup-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 1.1rem;
      outline: none;
      transition: border 0.15s ease;
    }

    .setup-input:focus {
      border-color: var(--accent-pitch);
    }

    .round-selector {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .round-option-btn {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      padding: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .round-option-btn:hover {
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .round-option-btn.selected {
      background: var(--accent-pitch);
      border-color: var(--accent-pitch);
      color: #070a12;
      box-shadow: 0 4px 15px var(--accent-pitch-glow);
    }

    /* Nasıl Oynanır Kartı */
    .rules-card {

  <!-- Toast Bildirim Yuvası -->

  <!-- ==========================================================================
       OYUN MOTORU VE MANTIĞI (Tek Başına Çalışan Saf JavaScript)
       ========================================================================== -->
  <script type="module">
    /**
     * ========================================================================
     * 1. BÖLÜM: ÖRNEK VERİ KATMANI (SAMPLE_PLAYERS)
     * ========================================================================
     * Eğer 'players.json' dosyası bulunamazsa veya ağ hatası olursa bu
     * 12 oyunculuk yaklaşık TEST verisi devreye girer.
     * Son Heung-min'in doğum yeri null bırakılarak null kontrolleri test edilebilir.
     */
    const SAMPLE_PLAYERS = [
      { id: "S1",  name: "Lionel Messi",       country: "Argentina",   birthPlace: { name: "Rosario",   lat: -32.95, lon: -60.65 }, birthYear: 1987, heightCm: 170, team: "Inter Miami",     intlCaps: 190, intlGoals: 112, peakMarketValueM: 180 },
      { id: "S2",  name: "Cristiano Ronaldo",  country: "Portugal",    birthPlace: { name: "Funchal",   lat: 32.65,  lon: -16.91 }, birthYear: 1985, heightCm: 187, team: "Al-Nassr",        intlCaps: 215, intlGoals: 135, peakMarketValueM: 120 },
      { id: "S3",  name: "Kylian Mbappé",      country: "France",      birthPlace: { name: "Paris",     lat: 48.857, lon: 2.352 },  birthYear: 1998, heightCm: 178, team: "Real Madrid",     intlCaps: 90,  intlGoals: 50,  peakMarketValueM: 200 },
      { id: "S4",  name: "Erling Haaland",     country: "Norway",      birthPlace: { name: "Leeds",     lat: 53.801, lon: -1.549 }, birthYear: 2000, heightCm: 194, team: "Manchester City", intlCaps: 40,  intlGoals: 36,  peakMarketValueM: 200 },
      { id: "S5",  name: "Luka Modrić",        country: "Croatia",     birthPlace: { name: "Zadar",     lat: 44.119, lon: 15.231 }, birthYear: 1985, heightCm: 172, team: "AC Milan",        intlCaps: 190, intlGoals: 27,  peakMarketValueM: 80 },
      { id: "S6",  name: "Arda Güler",         country: "Turkey",      birthPlace: { name: "Ankara",    lat: 39.933, lon: 32.86 },  birthYear: 2005, heightCm: 176, team: "Real Madrid",     intlCaps: 30,  intlGoals: 6,   peakMarketValueM: 70 },
      { id: "S7",  name: "Hakan Çalhanoğlu",   country: "Turkey",      birthPlace: { name: "Mannheim",  lat: 49.488, lon: 8.466 },  birthYear: 1994, heightCm: 178, team: "Inter",           intlCaps: 105, intlGoals: 20,  peakMarketValueM: 50 },
      { id: "S8",  name: "Mohamed Salah",      country: "Egypt",       birthPlace: { name: "Nagrig",    lat: 30.94,  lon: 30.81 },  birthYear: 1992, heightCm: 175, team: "Liverpool",       intlCaps: 110, intlGoals: 60,  peakMarketValueM: 150 },
      { id: "S9",  name: "Kevin De Bruyne",    country: "Belgium",     birthPlace: { name: "Drongen",   lat: 51.05,  lon: 3.667 },  birthYear: 1991, heightCm: 181, team: "Napoli",          intlCaps: 110, intlGoals: 33,  peakMarketValueM: 150 },
      { id: "S10", name: "Harry Kane",         country: "England",     birthPlace: { name: "London",    lat: 51.507, lon: -0.128 }, birthYear: 1993, heightCm: 188, team: "Bayern München",  intlCaps: 110, intlGoals: 75,  peakMarketValueM: 150 },
      { id: "S11", name: "Manuel Neuer",       country: "Germany",     birthPlace: { name: "Gelsenkirchen", lat: 51.518, lon: 7.086 }, birthYear: 1986, heightCm: 193, team: "Bayern München", intlCaps: 124, intlGoals: 0,   peakMarketValueM: 45 },
      { id: "S12", name: "Son Heung-min",      country: "South Korea", birthPlace: null,                                              birthYear: 1992, heightCm: 183, team: "LAFC",            intlCaps: 135, intlGoals: 54,  peakMarketValueM: 100 }
    ];
    // NOT: Yukarıdaki değerler yaklaşık TEST verisidir. Gerçek veri players.json'dan gelir.
    let usingSampleData = false;

    /**
     * loadPlayers()
     * TEK OYUNCU OKUMA FONKSİYONU:
     * Önce 'players.json' dosyasını okumayı dener; bulunamazsa SAMPLE_PLAYERS dizisine düşer.
     * Başka hiçbir yerde oyuncu verisi okunmaz.
     */
    async function loadPlayers() {
      try {
        const response = await fetch('players.json');
        if (!response.ok) {
          throw new Error(`HTTP Hata: ${response.status}`);
        }
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          return data;
        }
        throw new Error('Geçersiz oyuncu verisi');
      } catch (err) {
        console.warn('players.json okunamadı veya bulunamadı, yerleşik SAMPLE_PLAYERS kullanılıyor:', err.message);
        usingSampleData = true;
        return SAMPLE_PLAYERS;
      }
    }

    /**
     * ========================================================================
     * 2. BÖLÜM: SORU TANIMLARI VE SAF HESAPLAMA FONKSİYONLARI
     * ========================================================================
     */
    const QUESTION_TYPES = [
      { key: 'intlGoals',        title: 'Milli takımda kaç gol attı?',                 icon: '⚽', unit: 'gol',  shortName: 'Milli Gol' },
      { key: 'intlCaps',         title: 'Milli takımda kaç maça çıktı?',               icon: '🏃', unit: 'maç',  shortName: 'Milli Maç' },
      { key: 'heightCm',         title: 'Boyu kaç cm?',                                icon: '📏', unit: 'cm',   shortName: 'Boy (cm)' },
      { key: 'birthYear',        title: 'Hangi yıl doğdu?',                            icon: '🎂', unit: 'yılı', shortName: 'Doğum Yılı' },
      { key: 'peakMarketValueM', title: 'Kariyer zirvesindeki piyasa değeri kaç milyon €?', icon: '💶', unit: 'M€', shortName: 'Zirve Değer (M€)' },
      { key: 'birthPlace',       title: 'Nerede doğdu?',                               icon: '📍', unit: 'km mesafe', shortName: 'Doğum Yeri' }
    ];

    // Bir oyunda sorulacak özellik (tur) sayısı: tek hedef futbolcunun kaç özelliği sorulsun?
    const QUESTIONS_PER_GAME = 5;

    // Oyuncu panellerindeki kutuların başlıkları
    const BOX_TITLES = {
      intlGoals: 'Milli takımda attığı gol',
      intlCaps: 'Milli takımda maç sayısı',
      heightCm: 'Boyu',
      birthYear: 'Doğum yılı',
      peakMarketValueM: 'Zirve piyasa değeri',
      birthPlace: 'Doğum yeri'
    };

    function unitOf(qKey) {
      const q = QUESTION_TYPES.find(x => x.key === qKey);
      return q ? q.unit : '';
    }

    /**
     * hasValue(): Oyuncuda ilgili soru alanı dolu mu? (birthPlace için koordinat da gerekir)
     */
    function hasValue(player, key) {
      if (key === 'birthPlace') {
        const bp = player.birthPlace;
        return !!bp && typeof bp.lat === 'number' && typeof bp.lon === 'number';
      }
      return player[key] !== null && player[key] !== undefined;
    }

    /**
     * Haversine Formülü: İki coğrafi koordinat arasındaki küresel mesafeyi km cinsinden hesaplar.
     */
    function calculateHaversineDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Dünya yarıçapı (km)
      const toRad = Math.PI / 180;
      const dLat = (lat2 - lat1) * toRad;
      const dLon = (lon2 - lon1) * toRad;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    /**
     * calculateDifference(): İki oyuncunun ilgili soru özelliğindeki farkını hesaplar.
     * Sayısal alanlarda mutlak fark, doğum yerinde Haversine km mesafesi döner.
     */
    function calculateDifference(targetPlayer, guessPlayer, questionKey) {
      if (questionKey === 'birthPlace') {
        const tLoc = targetPlayer.birthPlace;
        const gLoc = guessPlayer.birthPlace;
        if (!tLoc || !gLoc) return Infinity;
        return calculateHaversineDistanceKm(tLoc.lat, tLoc.lon, gLoc.lat, gLoc.lon);
      }
      const tVal = targetPlayer[questionKey];
      const gVal = guessPlayer[questionKey];
      if (tVal === null || tVal === undefined || gVal === null || gVal === undefined) {
        return Infinity;
      }
      return Math.abs(gVal - tVal);
    }

    /**
     * normalizeText(): Türkçe karakterleri ve aksanları duyarsızlaştırır.
     * Örneğin 'Mbappe' yazınca 'Mbappé' veya 'hakan calhanoglu' yazınca 'Hakan Çalhanoğlu' bulunur.
     */
    function normalizeText(text) {
      if (!text) return '';
      return text
        .toString()
        .toLowerCase()
        .replace(/ğ/g, 'g')
        .replace(/ü/g, 'u')
        .replace(/ş/g, 's')
        .replace(/ı/g, 'i')
        .replace(/ö/g, 'o')
        .replace(/ç/g, 'c')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim();
    }


    /**
     * ========================================================================

    // Çalışma anında oluşturulan şehir listesi: { name, lat, lon, keys: [normalize edilmiş adlar] }
    let CITY_DB = [];

    function buildCityDb(players) {
      const byKey = new Map();
      function add(name, lat, lon, aliases) {
        if (typeof lat !== 'number' || typeof lon !== 'number') return;
        const key = normalizeText(name);
        if (!key) return;
        let entry = byKey.get(key);
        if (!entry) {
          entry = { name, lat, lon, keys: [key] };
          byKey.set(key, entry);
        }
        (aliases || []).forEach(a => {
          const ak = normalizeText(a);
          if (ak && !entry.keys.includes(ak)) entry.keys.push(ak);
          if (ak && !byKey.has(ak)) byKey.set(ak, entry);
        });
      }
      // Önce hazır liste (Türkçe takma adlar ve Türkiye illeri), sonra oyuncu doğum yerleri
      EXTRA_CITIES.forEach(c => add(c[0], c[1], c[2], c[3]));
      players.forEach(p => {
        if (p.birthPlace) add(p.birthPlace.name, p.birthPlace.lat, p.birthPlace.lon);
      });
      return Array.from(new Set(byKey.values()));
    }

    /** searchCities(): Aksan duyarsız şehir araması (adın veya takma adın içinde geçen). */
    function searchCities(query) {
      const q = normalizeText(query);
      if (!q) return [];
      return CITY_DB
        .filter(c => c.keys.some(k => k.includes(q)))
        .sort((a, b) => {
          const as = a.keys.some(k => k.startsWith(q)) ? 0 : 1;
          const bs = b.keys.some(k => k.startsWith(q)) ? 0 : 1;
          return as - bs || a.name.localeCompare(b.name);
        })
        .slice(0, 8);
    }

    /** findCityExact(): Yazılan metin bir şehir adı/takma adıyla tam eşleşiyorsa o şehri döndürür. */
    function findCityExact(text) {
      const q = normalizeText(text);
      return CITY_DB.find(c => c.keys.includes(q)) || null;
    }

    /**
     * makeCityGuess(): Seçilen şehri, calculateDifference() ile uyumlu bir "tahmin" nesnesine çevirir.
     * (birthPlace alanı olduğu için mesafe aynı Haversine fonksiyonuyla hesaplanır.)
     */
    function makeCityGuess(city) {
      return {
        id: 'city:' + normalizeText(city.name),
        name: city.name,
        isCityGuess: true,
        birthPlace: { name: city.name, lat: city.lat, lon: city.lon }
      };
    }

    /**
     * ========================================================================
     * 3. BÖLÜM: SES EFEKTLERİ MOTORU (Web Audio API Synthesizer)
     * ========================================================================
     */
    class SoundFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            this.ctx = new AudioContextClass();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.1) {
        if (!this.enabled) return;
        try {
          this.initContext();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch {
          // Ses desteklenmiyorsa sessiz kal
        }
      }

      click() {
        this.playTone(520, 'sine', 0.08, 0.08);
      }

      confirm() {
        this.playTone(600, 'sine', 0.1, 0.1);
        setTimeout(() => this.playTone(840, 'sine', 0.18, 0.12), 100);
      }

      success() {
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C E G C
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.25, 0.15), idx * 90);
        });
      }

      buzz() {
        this.playTone(160, 'sawtooth', 0.2, 0.12);
        setTimeout(() => this.playTone(130, 'sawtooth', 0.22, 0.12), 120);
      }
    }

    /**
     * ========================================================================
     * 5. BÖLÜM: TUR VE SORU SEÇİMİ MANTIĞI
     * ========================================================================
     */
    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function countAskable(player) {
      return QUESTION_TYPES.filter(q => hasValue(player, q.key)).length;
    }

    /**
     * startGame(): TEK bir hedef futbolcu seçer, onun 5 özelliğini (tur) belirler.
     * Hedef oyuncunun en az QUESTIONS_PER_GAME sorulabilir alanı olmalıdır.
     */
    function startGame() {
      // guessOnly: sadece tahmin listesinde çıkar, hedef futbolcu olarak seçilmez (ek Türk oyuncular)
      const targetable = state.allPlayers.filter(p => !p.guessOnly);
      let pool = targetable.filter(p => countAskable(p) >= QUESTIONS_PER_GAME);
      if (pool.length === 0) {
        // Yeterince dolu oyuncu yoksa en çok alanı dolu olanları kullan
        const max = Math.max(...targetable.map(countAskable));
        pool = targetable.filter(p => countAskable(p) === max);
      }
      const target = pool[Math.floor(Math.random() * pool.length)];
      const questions = shuffleArray(QUESTION_TYPES.filter(q => hasValue(target, q.key))).slice(0, QUESTIONS_PER_GAME);

      state.targetPlayer = target;
      state.questions = questions;
      state.totalRounds = questions.length;
      state.currentRound = 1;
      state.p1Score = 0;
      state.p2Score = 0;
      state.rounds = questions.map((q, i) => ({
        roundNum: i + 1,
        targetPlayer: target,
        question: q,
        p1Guess: null,
        p2Guess: null,
        diffP1: null,
        diffP2: null,
        winner: null,
        resolved: false
      }));
      state.roundHistory = state.rounds;
      beginRound();
    }

    /** beginRound(): Mevcut tur için Oyuncu 1'in tahmin sırasını başlatır. */
    function beginRound() {
      state.question = state.questions[state.currentRound - 1];
      state.p1GuessPlayer = null;
      state.p2GuessPlayer = null;
      state.view = 'ROUND_P1';
      render();
    }

    }

    function renderBoard(mode) {
      const target = state.targetPlayer;
      const curIdx = state.currentRound - 1;
      const isResult = mode === 'result';
      const isLastRound = state.currentRound >= state.totalRounds;

      // ---- Bir oyuncunun panelindeki tek bir özellik kutusu ----
      function questionBox(key, idx) {
        const r = state.rounds[idx];
        const q = r.question;
        const isP1 = key === 'p1';
        const isCurrent = idx === curIdx;
        const done = r.resolved;
        const isActive = isCurrent && !done && mode === key;
        const guess = isP1 ? r.p1Guess : r.p2Guess;
        const pendingGuess = isCurrent && !done ? (isP1 ? state.p1GuessPlayer : state.p2GuessPlayer) : null;

        let cls = 'q-box';
        let tag = `Tur ${idx + 1}`;
        let body = '';

        if (done) {
          const diff = isP1 ? r.diffP1 : r.diffP2;
          const won = r.winner === key || r.winner === 'tie';
          cls += won ? ' q-won' : ' q-lost';
          tag = r.winner === 'tie' ? 'Berabere +1' : (won ? 'Kazandı +1' : 'Puan yok');
          if (guess.isCityGuess) {
            // Şehir tahmini: şehir adı + hedefe km uzaklığı
            body = `
              <div class="q-guess-name">📍 ${guess.name}</div>
              <div class="q-diff tabular-nums">${formatDifference(diff, q.key)}</div>`;
          } else {
            body = `
              <div class="q-guess-name">${guess.name}</div>
              <div class="q-guess-meta">${[guess.team, guess.country].filter(Boolean).join(' · ')}</div>
              <div class="q-value-row">
                <span class="q-value-label">Değer</span>
                <span class="q-value-line tabular-nums">${shortValue(guess, q.key)}</span>
              </div>
              <div class="q-diff tabular-nums">${formatDifference(diff, q.key)}</div>`;
          }
        } else if (isActive) {
          cls += ' q-active';
          tag = 'Sıra sende';
          body = `
            <div id="errorAlertBox" style="display: none;" class="alert-box"></div>
            <div class="guess-form">
              <div class="input-group">
                <input type="text" id="playerSearchInput" class="search-input"
                       placeholder="${q.key === 'birthPlace' ? 'Hedefin doğduğu şehri tahmin et (örn. Londra)...' : 'Hedefe en yakın futbolcu...'}" autocomplete="off" spellcheck="false" />
                <ul id="autocompleteDropdown" class="autocomplete-list" style="display: none;"></ul>
              </div>
              <button id="confirmGuessBtn" class="btn ${isP1 ? 'btn-p1' : 'btn-p2'}">Tahmini Kilitle 🔒</button>
            </div>`;
        } else if (pendingGuess) {
          // Tahmin yapıldı ama sonuç açıklanmadı: ismi GİZLİ tut
          cls += ' q-locked';
          tag = 'Kilitli';
          body = `<div class="q-placeholder"><strong>🔒 Tahmin kilitlendi ✓</strong><small>Sonuç iki tahminden sonra açılır</small></div>`;
        } else if (isCurrent) {
          cls += ' q-waiting';
          tag = 'Bekliyor';
          body = `<div class="q-placeholder"><strong>⏳ Sıra rakipte…</strong></div>`;
        } else {
          cls += ' q-future';
          body = `<div class="q-placeholder"><small>Henüz sorulmadı</small></div>`;
        }

        return `
          <div class="${cls}">
            <div class="q-box-head">
              <span class="q-box-title"><span class="q-box-icon">${q.icon}</span>${BOX_TITLES[q.key]}</span>
              <span class="q-box-tag">${tag}</span>
            </div>
            <div class="q-box-body">${body}</div>
          </div>`;
      }

      // ---- Yan panel ----
      function sidePanel(key) {
        const isP1 = key === 'p1';
        const name = isP1 ? state.p1Name : state.p2Name;
        const score = isP1 ? state.p1Score : state.p2Score;
        const isActive = mode === key;
        const boxes = state.rounds.map((_, i) => questionBox(key, i)).join('');
        return `
          <section class="board-col side-panel side-${key} ${isActive ? 'is-active' : ''}">
            <header class="side-head">
              <span class="side-name">${name}</span>
              <span class="side-score tabular-nums">${score}</span>
            </header>
            <div class="q-box-list">${boxes}</div>
          </section>`;
      }

      // ---- Orta panel: Hedef Futbolcu ----
      const cur = state.rounds[curIdx];
      const propRows = state.rounds.map((r, i) => {
        const known = r.resolved;
        const rowCls = known ? 'done' : (i === curIdx ? 'current' : '');
        return `
          <div class="prop-row ${rowCls}">
            <span class="prop-name">${r.question.icon} ${BOX_TITLES[r.question.key]}</span>
            <span class="prop-val tabular-nums">${known ? shortValue(target, r.question.key) : '?'}</span>
          </div>`;
      }).join('');

      let outcomeHtml = '';
      if (isResult) {
        let outcomeText;
        if (cur.winner === 'p1') outcomeText = `🏆 Turu <span style="color: var(--p1-color);">${state.p1Name}</span> kazandı (+1)`;
        else if (cur.winner === 'p2') outcomeText = `🏆 Turu <span style="color: var(--p2-color);">${state.p2Name}</span> kazandı (+1)`;
        else outcomeText = `🤝 Berabere! İkisi de +1 puan aldı`;
        outcomeHtml = `
          <div class="value-block center-value">
            <div class="value-label">Gerçek Değer</div>
            <div class="value-line tabular-nums">${shortValue(target, cur.question.key)}</div>
          </div>
          <div class="round-outcome-banner">${outcomeText}</div>
          <button id="nextRoundBtn" class="btn btn-primary">
            ${isLastRound ? '🏁 Final Sonuçlarını Gör →' : `Sonraki Tur (${state.currentRound + 1} / ${state.totalRounds}) →`}
          </button>`;
      }

      const centerPanel = `
        <section class="board-col board-center">
          <span class="target-kicker">Hedef Futbolcu</span>
          <h1 class="target-name" lang="en">${target.name}</h1>
          <div class="round-pill">Tur ${state.currentRound} / ${state.totalRounds}</div>
          <div class="target-question-box">
            <span class="target-question-icon">${cur.question.icon}</span>
            <span>${cur.question.title}</span>
          </div>
          <div class="center-props">${propRows}</div>
          ${outcomeHtml}
        </section>`;

      appRoot.innerHTML = `
        <div class="board">
          ${sidePanel('p1')}
          ${centerPanel}
          ${sidePanel('p2')}
        </div>`;

      if (isResult) {
        document.getElementById('nextRoundBtn').addEventListener('click', () => {
          sfx.click();
          if (isLastRound) {
            state.view = 'GAMEOVER';
            render();
          } else {
            state.currentRound += 1;
            beginRound();
          }
        });
      } else {
        setupAutocompleteAndSubmit(mode);
      }
    }

    /**
     * Otomatik Tamamlama ve Tahmin Doğrulama Fonksiyonu
     */
    function setupAutocompleteAndSubmit(activePlayerKey) {
      const searchInput = document.getElementById('playerSearchInput');
      const dropdown = document.getElementById('autocompleteDropdown');
      const submitBtn = document.getElementById('confirmGuessBtn');
      const errorBox = document.getElementById('errorAlertBox');

      let selectedPlayer = null;   // Şehir turunda: seçilen şehir nesnesi
      let highlightedIndex = -1;
      let matchedList = [];
      const isCityRound = state.question.key === 'birthPlace';

      searchInput.focus();

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'flex';
        sfx.buzz();
      }

      function clearError() {
        errorBox.style.display = 'none';
        errorBox.textContent = '';
      }

      // Input değişimi
      searchInput.addEventListener('input', () => {
        clearError();
        selectedPlayer = null;
        const query = normalizeText(searchInput.value);

        if (!query || query.length < 1) {
          dropdown.style.display = 'none';
          matchedList = [];
          highlightedIndex = -1;
          return;
        }

        // Filtrele: Aksan duyarsız arama
        // Hedef, rakibin seçimi ve bu soruda verisi olmayan oyuncular listede hiç görünmez.
        const qKey = state.question.key;
        if (isCityRound) {
          // DOĞUM YERİ TURU: oyuncu değil şehir aranır
          matchedList = searchCities(searchInput.value);
          if (matchedList.length === 0) {
            dropdown.innerHTML = `<li class="autocomplete-item" style="color: var(--text-dim); cursor: default;">Eşleşen şehir bulunamadı</li>`;
            dropdown.style.display = 'block';
            highlightedIndex = -1;
            return;
          }
          dropdown.innerHTML = matchedList.map((c, index) => `
            <li class="autocomplete-item" data-index="${index}">
              <span class="autocomplete-item-name">📍 ${c.name}</span>
            </li>
          `).join('');
          dropdown.style.display = 'block';
          highlightedIndex = -1;
          return;
        }
        matchedList = state.allPlayers
          .filter(p => {
            if (p.id === state.targetPlayer.id) return false;
            if (activePlayerKey === 'p2' && state.p1GuessPlayer && p.id === state.p1GuessPlayer.id) return false;
            if (!hasValue(p, qKey)) return false;
            return normalizeText(p.name).includes(query);
          })
          .sort((x, y) => {
            // Önce isim başı eşleşenler
            const xs = normalizeText(x.name).startsWith(query) ? 0 : 1;
            const ys = normalizeText(y.name).startsWith(query) ? 0 : 1;
            return xs - ys;
          })
          .slice(0, 8);

        if (matchedList.length === 0) {
          dropdown.innerHTML = `<li class="autocomplete-item" style="color: var(--text-dim); cursor: default;">Eşleşen futbolcu bulunamadı</li>`;
          dropdown.style.display = 'block';
          highlightedIndex = -1;
          return;
        }

        dropdown.innerHTML = matchedList.map((p, index) => `
          <li class="autocomplete-item" data-index="${index}">
            <span class="autocomplete-item-name">${p.name}</span>
            <span class="autocomplete-item-meta">
              <span>${p.team || ''}</span>
              <span>·</span>
              <span>${p.country || ''}</span>
            </span>
          </li>
        `).join('');

        dropdown.style.display = 'block';
        highlightedIndex = -1;
      });

      // Klavyeyle gezinme
      searchInput.addEventListener('keydown', (e) => {
        const items = dropdown.querySelectorAll('.autocomplete-item[data-index]');
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (items.length === 0) return;
          highlightedIndex = (highlightedIndex + 1) % items.length;
          updateHighlight(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (items.length === 0) return;
          highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
          updateHighlight(items);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (highlightedIndex >= 0 && items[highlightedIndex]) {
            selectPlayer(matchedList[highlightedIndex]);
          } else {
            handleFormSubmit();
          }
        } else if (e.key === 'Escape') {
          dropdown.style.display = 'none';
        }
      });

      function updateHighlight(items) {
        items.forEach((item, idx) => {
          if (idx === highlightedIndex) {
            item.classList.add('selected');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('selected');
          }
        });
      }

      function selectPlayer(p) {
        selectedPlayer = p;
        searchInput.value = p.name;
        dropdown.style.display = 'none';
        clearError();
        sfx.click();
      }

      // Tıklamayla seçim
      dropdown.addEventListener('click', (e) => {
        const item = e.target.closest('.autocomplete-item[data-index]');
        if (item) {
          const idx = parseInt(item.dataset.index, 10);
          if (matchedList[idx]) {
            selectPlayer(matchedList[idx]);
          }
        }
      });

      // Form Onayı
      function handleFormSubmit() {
        clearError();
        const rawInput = searchInput.value.trim();
        const normInput = normalizeText(rawInput);

        // DOĞUM YERİ TURU: şehir doğrulama (hedef şehrin kendisi de doğru tahmindir, 0 km)
        if (isCityRound) {
          const city = selectedPlayer || findCityExact(rawInput);
          if (!city) {
            showError('Lütfen açılır listeden geçerli bir şehir seçin! (örn. Londra, Barcelona, İstanbul)');
            return;
          }
          // Oyuncu 2, Oyuncu 1'in seçtiği şehri seçemez
          if (activePlayerKey === 'p2' && state.p1GuessPlayer && state.p1GuessPlayer.id === 'city:' + normalizeText(city.name)) {
            showError(`${city.name} bu turda rakibiniz tarafından seçildi, başka bir şehir seçin!`);
            selectedPlayer = null;
            searchInput.value = '';
            return;
          }
          sfx.confirm();
          const cityGuess = makeCityGuess(city);
          if (activePlayerKey === 'p1') {
            state.p1GuessPlayer = cityGuess;
            state.view = 'ROUND_P2';
            render();
          } else {
            state.p2GuessPlayer = cityGuess;
            calculateRoundResult();
          }
          return;
        }

        if (!selectedPlayer) {
          // İsme tam veya en yakın eşleşen tek oyuncu var mı?
          const exactMatch = state.allPlayers.find(p => normalizeText(p.name) === normInput);
          if (exactMatch) {
            selectedPlayer = exactMatch;
          }
        }

        // 1. Kural: Listede olmayan isim kabul edilmez.
        if (!selectedPlayer) {
          showError('Lütfen açılır öneri listesinden geçerli bir futbolcu seçin!');
          return;
        }

        // 2. Kural: Hedef oyuncunun kendisi tahmin olarak seçilemez!
        if (selectedPlayer.id === state.targetPlayer.id) {
          showError('Hedef oyuncunun kendisini seçemezsiniz! Başka bir futbolcu seçin.');
          selectedPlayer = null;
          searchInput.value = '';
          return;
        }

        // 3. Kural: Oyuncu 2, Oyuncu 1'in seçtiği oyuncuyu seçemez!
        if (activePlayerKey === 'p2' && state.p1GuessPlayer && selectedPlayer.id === state.p1GuessPlayer.id) {
          showError(`Bu oyuncu (${selectedPlayer.name}) bu turda rakibiniz tarafından seçildi, başka bir oyuncu seçin!`);
          selectedPlayer = null;
          searchInput.value = '';
          return;
        }

        // 4. Kural: NULL Kontrolü:
        // Kullanıcının tahmin ettiği oyuncuda ilgili alan null ise tahmin geçersiz sayılmaz;
        // kullanıcıya "Bu oyuncunun bu bilgisi veritabanında yok, başka bir oyuncu seç" uyarısı çıkar ve tekrar seçtirilir.
        const qKey = state.question.key;
        if (!hasValue(selectedPlayer, qKey)) {
          showError(`Bu oyuncunun (${selectedPlayer.name}) bu bilgisi (${state.question.shortName}) veritabanında yok, lütfen başka bir oyuncu seçin!`);
          selectedPlayer = null;
          searchInput.value = '';
          return;
        }

        // Geçerli seçim!
        sfx.confirm();
        if (activePlayerKey === 'p1') {
          state.p1GuessPlayer = selectedPlayer;
          state.view = 'ROUND_P2';
          render();
        } else {
          state.p2GuessPlayer = selectedPlayer;
          calculateRoundResult();
        }
      }

      submitBtn.addEventListener('click', handleFormSubmit);
    }

    /**
     * ========================================================================
     * 7. BÖLÜM: TUR SONUCU HESAPLAMA VE SONUÇ EKRANI
     * ========================================================================
     */
    function calculateRoundResult() {
      const cur = state.rounds[state.currentRound - 1];
      const target = state.targetPlayer;
      const qKey = cur.question.key;
      const p1 = state.p1GuessPlayer;
      const p2 = state.p2GuessPlayer;

      const diffP1 = calculateDifference(target, p1, qKey);
      const diffP2 = calculateDifference(target, p2, qKey);

      let winner;
      if (diffP1 < diffP2) {
        winner = 'p1';
        state.p1Score += 1;
      } else if (diffP2 < diffP1) {
        winner = 'p2';
        state.p2Score += 1;
      } else {
        winner = 'tie';
        state.p1Score += 1;
        state.p2Score += 1;
      }

      cur.p1Guess = p1;
      cur.p2Guess = p2;
      cur.diffP1 = diffP1;
      cur.diffP2 = diffP2;
      cur.winner = winner;
      cur.resolved = true;

      state.view = 'RESULT';
      render();
    }

    function formatValue(player, qKey) {
      if (qKey === 'birthPlace') {
        const bp = player.birthPlace;
        return bp ? `${bp.name} (${bp.lat.toFixed(1)}°, ${bp.lon.toFixed(1)}°)` : 'Bilinmiyor';
      }
      if (qKey === 'birthYear') return `${player[qKey]}`;   // yıl: binlik ayırıcı yok
      return `${player[qKey].toLocaleString('tr-TR')} ${unitOf(qKey)}`;
    }

    function formatDifference(diff, qKey) {
      if (diff === Infinity) return 'Veri Yok';
      if (qKey === 'birthPlace') {
        return `${diff.toLocaleString('tr-TR')} km mesafe`;
      }
      if (qKey === 'birthYear') return `${diff} yıl fark`;
      return `${diff.toLocaleString('tr-TR')} ${unitOf(qKey)} fark`;
    }

    function renderResultView() {
      sfx.success();
      renderBoard('result');
    }

    /**
     * ========================================================================
     * 8. BÖLÜM: FİNAL VE OYUN BİTİŞ EKRANI
     * ========================================================================
     */
    function renderGameOverView() {
      sfx.success();
      let outcomeTitle = '';
      let outcomeDesc = '';

      if (state.p1Score > state.p2Score) {
        outcomeTitle = `🏆 ŞAMPİYON: ${state.p1Name}!`;
        outcomeDesc = `${state.p1Name} futbolcu bilgisini konuşturdu ve düelloyu kazandı!`;
      } else if (state.p2Score > state.p1Score) {
        outcomeTitle = `🏆 ŞAMPİYON: ${state.p2Name}!`;
        outcomeDesc = `${state.p2Name} futbolcu bilgisini konuşturdu ve düelloyu kazandı!`;
      } else {
        outcomeTitle = `🤝 DOSTLUK KAZANDI: BERABERE!`;
        outcomeDesc = `İki oyuncu da eşit puan toplayarak müthiş bir futbol bilgisi sergiledi.`;
      }

      // Tur geçmişi listesi HTML'i
      const historyRowsHtml = state.roundHistory.map(r => {
        let winnerTag = '';
        if (r.winner === 'p1') winnerTag = `<strong style="color: var(--p1-color);">${state.p1Name} kazandı</strong>`;
        else if (r.winner === 'p2') winnerTag = `<strong style="color: var(--p2-color);">${state.p2Name} kazandı</strong>`;
        else winnerTag = `<strong style="color: var(--accent-gold);">Berabere</strong>`;

        return `
          <div class="history-item">
            <div>
              <div style="font-weight: 700; color: #fff;">
                Tur ${r.roundNum}: ${r.question.shortName} · Gerçek: ${shortValue(r.targetPlayer, r.question.key)}
              </div>
              <div style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.2rem;">
                ${state.p1Name}: <em>${r.p1Guess.name}</em> (${formatDifference(r.diffP1, r.question.key)}) · 
                ${state.p2Name}: <em>${r.p2Guess.name}</em> (${formatDifference(r.diffP2, r.question.key)})
              </div>
            </div>
            <div>${winnerTag}</div>
          </div>
        `;
      }).join('');

      appRoot.innerHTML = `
        <div class="card-panel gameover-podium">
          <div class="gameover-trophy">🏆</div>
          <h2 class="gameover-winner-title">${outcomeTitle}</h2>
          <p style="color: var(--text-muted); font-size: 1.05rem;">${outcomeDesc}</p>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.4rem;">Hedef futbolcu: <strong style="color:#fff;" lang="en">${state.targetPlayer.name}</strong></p>

          <!-- Skor Göstergesi -->
          <div class="gameover-score-pill">
            <div class="gameover-score-item">
              <span style="font-size: 0.85rem; color: var(--p1-color); font-weight: 700; text-transform: uppercase;">${state.p1Name}</span>
              <span class="gameover-score-num tabular-nums" style="color: var(--p1-color);">${state.p1Score}</span>
            </div>
            <span style="font-size: 1.8rem; font-weight: 800; color: var(--text-dim);">-</span>
            <div class="gameover-score-item">
              <span style="font-size: 0.85rem; color: var(--p2-color); font-weight: 700; text-transform: uppercase;">${state.p2Name}</span>
              <span class="gameover-score-num tabular-nums" style="color: var(--p2-color);">${state.p2Score}</span>
            </div>
          </div>

          <button id="playAgainBtn" class="btn btn-primary" style="max-width: 320px; margin: 0 auto 2rem;">
            🔄 Yeniden Oyna
          </button>

          <!-- Tur Özeti -->
          <div class="history-section">
            <h3 class="history-title">📊 Tur Özeti ve Karşılaştırmalar</h3>
            <div class="history-list">
              ${historyRowsHtml}
            </div>
          </div>
        </div>
      `;

      document.getElementById('playAgainBtn').addEventListener('click', () => {
        sfx.click();
        state.view = 'SETUP';
        render();
      });
    }

    /**
     * ========================================================================
     * 9. BÖLÜM: UYGULAMA BAŞLATMA (Bootstrap)
     * ========================================================================
     */
    async function initGame() {
      // Oyuncu verisini TEK bir yerden yükle
      state.allPlayers = await loadPlayers();
      CITY_DB = buildCityDb(state.allPlayers);
      console.log(`[Futbolcu Düellosu] ${state.allPlayers.length} oyuncu başarıyla yüklendi.`);
      render();
    }

    initGame();
  </script>
</body>
</html>
